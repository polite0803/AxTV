name: refactor-tests

on:
  push:
    paths:
      - "refactor/**"
      - ".github/workflows/refactor-tests.yml"
  pull_request:
    paths:
      - "refactor/**"
      - ".github/workflows/refactor-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        working-directory: refactor
        run: chmod +x gradlew

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit 5 tests
        working-directory: refactor
        run: ./gradlew :tests:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            refactor/tests/build/reports/tests/test
            refactor/tests/build/test-results/test
