name: ci

# 统一 CI：android 模块 + refactor 模块 + release(R8) 构建验证
on:
  push:
    paths:
      - "android/**"
      - "refactor/**"
      - ".github/workflows/ci.yml"
      - "README.md"
  pull_request:
    paths:
      - "android/**"
      - "refactor/**"
      - ".github/workflows/ci.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # android-actions/setup-android@v3 会执行 `sdkmanager tools`，而该包已从
        # SDK 仓库移除（Failed to find package 'tools'）。直接用 runner 预装的
        # cmdline-tools，并把 sdkmanager 路径写入后续步骤。
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          if [ -z "$CMDLINE" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            ls -R "$SDK_ROOT/cmdline-tools" >&2 || true
            exit 1
          fi
          echo "SDKMANAGER=$CMDLINE" >> "$GITHUB_ENV"
          "$CMDLINE" --version

      - name: Install SDK platform and build tools
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and assemble
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
            android/app/build/reports/lint-results-debug.html

  # release 构建门：QuickJS JNI / ModelJsonCodec 反射 / JS 桥都依赖 R8 keep 规则，
  # 只跑 assembleDebug 无法暴露 keep 回归。用 CI 专用 dummy keystore 签名，
  # 产物不分发、不上传，仅为让 R8 真实跑一遍。
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          if [ -z "$CMDLINE" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "SDKMANAGER=$CMDLINE" >> "$GITHUB_ENV"
          "$CMDLINE" --version

      - name: Install SDK platform and build tools
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CI-only dummy keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/android/ci-dummy.jks" \
            -alias ci-dummy -keyalg RSA -keysize 2048 -validity 30 \
            -storepass ci-dummy-password -keypass ci-dummy-password \
            -dname "CN=AxTV CI Dummy, O=AxTV, C=CN"

      - name: Assemble release (R8 keep-rule gate)
        working-directory: android
        env:
          AXTV_STORE_FILE: ${{ github.workspace }}/android/ci-dummy.jks
          AXTV_STORE_PASSWORD: ci-dummy-password
          AXTV_KEY_ALIAS: ci-dummy
          AXTV_KEY_PASSWORD: ci-dummy-password
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

  # 版本一致性门：README「当前版本」必须跟上 build.gradle.kts 的 versionName。
  # 本地同样可跑：scripts/check-version.sh（坏样本自证见该脚本注释）。
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README version == versionName
        run: bash scripts/check-version.sh

  refactor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        working-directory: refactor
        run: chmod +x gradlew

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit 5 tests
        working-directory: refactor
        run: ./gradlew :tests:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            refactor/tests/build/reports/tests/test
            refactor/tests/build/test-results/test
