name: ci

# 统一 CI：android 模块 + refactor 模块 + 两侧交叉编译检查
on:
  push:
    paths:
      - "android/**"
      - "refactor/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/refactor-tests.yml"
      - "*.gradle"
      - "gradle/**"
  pull_request:
    paths:
      - "android/**"
      - "refactor/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/refactor-tests.yml"
      - "*.gradle"
      - "gradle/**"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # android-actions/setup-android@v3 会执行 `sdkmanager tools`，而该包已从
        # SDK 仓库移除（Failed to find package 'tools'）。直接用 runner 预装的
        # cmdline-tools，并把 sdkmanager 路径写入后续步骤。
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          if [ -z "$CMDLINE" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            ls -R "$SDK_ROOT/cmdline-tools" >&2 || true
            exit 1
          fi
          echo "SDKMANAGER=$CMDLINE" >> "$GITHUB_ENV"
          "$CMDLINE" --version

      - name: Install SDK platform and build tools
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and assemble
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
            android/app/build/reports/lint-results-debug.html

  refactor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        working-directory: refactor
        run: chmod +x gradlew

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit 5 tests
        working-directory: refactor
        run: ./gradlew :tests:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            refactor/tests/build/reports/tests/test
            refactor/tests/build/test-results/test
