<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 电视台直播源推送页。{{KEY}} 由电视端 ThemeRenderer 替换：THEME_CSS 色值、PANEL_HEAD 共用样式、DEVICE_NAME 电视名称 -->
<style>{{THEME_CSS}}</style>
{{PANEL_HEAD}}
<title>电视台直播源 · {{DEVICE_NAME}}</title>
<style>
  .iptv-wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  .iptv-field { margin-bottom: 16px; }
  .iptv-field label { display: block; margin-bottom: 6px; font-weight: 600; }
  .iptv-field input, .iptv-field textarea {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--outline, #888);
    background: var(--surface, #fff); color: var(--on-surface, #111);
    font-size: 15px; font-family: inherit;
  }
  .iptv-field textarea { min-height: 120px; resize: vertical; }
  .iptv-hint { color: var(--on-surface-variant, #666); font-size: 13px; margin: 4px 0 0; }
  .iptv-btn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--primary, #4a6cf7); color: var(--on-primary, #fff);
    font-size: 16px; font-weight: 700;
  }
  .iptv-btn:disabled { opacity: .6; cursor: default; }
  .iptv-msg { margin-top: 14px; font-size: 14px; min-height: 20px; white-space: pre-wrap; }
  .iptv-msg.ok { color: var(--primary, #2e7d32); }
  .iptv-msg.err { color: var(--error, #b3261e); }
</style>
</head>
<body>
<div class="iptv-wrap">
  <h2>添加电视台直播源</h2>
  <p class="iptv-hint">推送到 <strong>{{DEVICE_NAME}}</strong>。粘贴一条 M3U/M3U8 播放清单的地址，或整份清单正文（以 #EXTM3U 开头）。</p>
  <form id="iptvForm" autocomplete="off">
    <div class="iptv-field">
      <label for="iptvName">源名称</label>
      <input type="text" id="iptvName" name="name" placeholder="例如：我的央视清单" required maxlength="60" />
    </div>
    <div class="iptv-field">
      <label for="iptvSource">直播源（URL 或整份 M3U 正文）</label>
      <textarea id="iptvSource" name="source" placeholder="https://…/xxx.m3u8&#10;或粘贴 #EXTM3U 开头的整份正文" required></textarea>
    </div>
    <button type="submit" class="iptv-btn" id="iptvSubmit">推送到电视</button>
    <div id="iptvMsg" class="iptv-msg"></div>
  </form>
</div>

<script>
var PANEL_TOKEN = new URLSearchParams(location.search).get('token') || '';
var TOKEN_QUERY = PANEL_TOKEN ? ('?token=' + encodeURIComponent(PANEL_TOKEN)) : '';

document.getElementById('iptvForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('iptvSubmit');
  var msg = document.getElementById('iptvMsg');
  var name = document.getElementById('iptvName').value.trim();
  var source = document.getElementById('iptvSource').value.trim();
  msg.className = 'iptv-msg';
  msg.textContent = '';
  if (!name || !source) {
    msg.className = 'iptv-msg err';
    msg.textContent = '请同时填写源名称和直播源。';
    return;
  }
  btn.disabled = true;
  btn.textContent = '推送中…';
  try {
    var r = await fetch('/api/iptv' + TOKEN_QUERY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, source: source })
    });
    var data = await r.json();
    msg.className = 'iptv-msg ' + (data.success ? 'ok' : 'err');
    msg.textContent = data.message || (data.success ? '推送成功' : '推送失败');
  } catch (err) {
    msg.className = 'iptv-msg err';
    msg.textContent = '推送失败：' + err;
  } finally {
    btn.disabled = false;
    btn.textContent = '推送到电视';
  }
});
</script>
</body>
</html>
