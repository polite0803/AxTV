org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9.0 默认启用内置 Kotlin（会接管 Kotlin 编译并移除 kotlin-android 插件）。
# 本轮暂不切换：内置 Kotlin 的 Kotlin 版本与 org.jetbrains.kotlin.plugin.compose 的版本对齐方式尚未验证，
# 先显式 opt-out 保持 KGP 2.3.21 + Compose 插件 2.3.21 一致。注意 AGP 10.0 将无法再关闭。
android.builtInKotlin=false
# AGP 9.0 默认开启新 DSL（android.newDsl=true），它与 org.jetbrains.kotlin.android 不兼容
# （实测报错：ApplicationExtensionImpl cannot be cast to BaseExtension）。
# 保留 KGP 2.3.21 + Compose 插件 2.3.21 的严格版本对齐，故同时关闭新 DSL；AGP 10.0 两者都将移除。
android.newDsl=false
