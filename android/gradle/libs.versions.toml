[versions]
agp = "8.7.3"
kotlin = "2.1.0"
composeBom = "2024.12.01"
media3 = "1.5.1"
okhttp = "4.12.0"
coil = "2.7.0"
glance = "1.1.1"
work = "2.10.0"
quickjs = "1.6.0"          # com.github.dokar3:quickjs-android（原 com.whl.quickjs.wrapper 同源）
coroutines = "1.9.0"
desugarJdkLibs = "2.1.5"   # 核心库 desugaring：minSdk 23 下提供 java.time / java.util.stream / List.of 等
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-tv = { group = "androidx.tv", name = "tv-foundation", version = "1.0.0-alpha11" }
compose-tv-material = { group = "androidx.tv", name = "tv-material", version = "1.0.0" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version = "1.0.0" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
quickjs-android = { group = "com.github.dokar3", name = "quickjs-quickjs-android-wrapper", version.ref = "quickjs" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
