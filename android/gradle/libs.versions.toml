[versions]
agp = "9.0.1"
kotlin = "2.3.21"
composeBom = "2026.06.01"
media3 = "1.11.1"
okhttp = "4.12.0"
coil = "2.7.0"
work = "2.12.0"
quickjs = "1.6.0"          # com.github.dokar3:quickjs-android（原 com.whl.quickjs.wrapper 同源）
coroutines = "1.11.0"
desugarJdkLibs = "2.1.5"   # 核心库 desugaring：minSdk 24 下提供 java.time / java.util.stream / List.of 等
coreKtx = "1.17.0"
lifecycle = "2.9.1"
activityCompose = "1.13.0"
palette = "1.0.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# tv-foundation 1.0.0-alpha12 起移除了 lazy 布局（TvLazyColumn/TvLazyRow/rememberTvLazyListState），
# 1.0.0 稳定版只含 androidx.tv.foundation.text。本轮已将全部 TvLazy* 调用迁到 androidx.compose.foundation.lazy。
# 升级本行必须与全部 TvLazy* 调用点迁移同一提交，且须等并行 UI 线落地后执行，不可与 UI 改写并发。
compose-tv = { group = "androidx.tv", name = "tv-foundation", version = "1.0.0" }
compose-tv-material = { group = "androidx.tv", name = "tv-material", version = "1.1.0" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version = "1.1.0" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# 画面取色（color_source=CONTENT）用；既有依赖里只有 Coil 负责加载位图，没有能从位图提取主色的库。
androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
quickjs-android = { group = "com.github.dokar3", name = "quickjs-quickjs-android-wrapper", version.ref = "quickjs" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
# 二维码生成（设置页『二维码链接』行）：纯 Java、Apache-2.0，原版 APK 同样内置 zxing（src/app/p000/r30.java:243 引用 com.google.zxing.qrcode.decoder.ErrorCorrectionLevel）
zxing-core = { group = "com.google.zxing", name = "core", version = "3.5.3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
